server {
    listen 8443 ssl;
    ssl_certificate /run/tls/server.crt;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /runtime-config.js {
        default_type application/javascript;
        add_header Cache-Control no-store;
        return 200 'window.HUNTER_API_URL = window.HUNTER_API_URL || window.location.origin;';
    }
    location ~ ^/(cadastrar|login|usuario|feedback|feedbacks|alerta-preco|alertas|alerta|notificacoes|lojas|buscar-produtos|produtos|analytics|nlp|sugestoes|health|docs|redoc|openapi.json)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { try_files $uri $uri/ =404; add_header Cache-Control no-cache; }
    # Aliases para os caminhos de assets das versoes anteriores.
    location = /ui.js { alias /usr/share/nginx/html/assets/js/ui.js; }
    location = /dashboard.js { alias /usr/share/nginx/html/assets/js/dashboard.js; }
    location = /ui.css { alias /usr/share/nginx/html/assets/css/ui.css; }
    location = /styles.css { alias /usr/share/nginx/html/assets/css/styles.css; }
    location /imgfeature/ { alias /usr/share/nginx/html/assets/imgfeature/; }
    location /img/ { alias /usr/share/nginx/html/assets/img/; }
    location ~ /\. { deny all; }
}
