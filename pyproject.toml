[tool.ruff]
target-version = "py312"
exclude = [".venv", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["backend", "config", "messaging", "catalog_expansion", "data_mining", "nlp", "scraping"]
omit = ["*/demo.py", "*/testing.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
