# Copie isolada de producao local. Nunca monta volumes/dados do principal.
name: hunter-simulation
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hunter_sim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SIM_POSTGRES_PASSWORD:?Use scripts/simulate_production.py}
    entrypoint: [sh, /opt/hunter/postgres_tls.sh]
    volumes:
      - simulation_postgres:/var/lib/postgresql/data
      - ${HUNTER_SIM_TLS}/postgres:/run/tls:ro
      - ./ops/postgres_tls.sh:/opt/hunter/postgres_tls.sh:ro
      - ./ops/pg_hba.simulation.conf:/opt/hunter/pg_hba.conf:ro
    ports: ['127.0.0.1:55433:5432']
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d hunter_sim]
      interval: 5s
      timeout: 5s
      retries: 24
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: hunter-simulation-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: simulation_admin
      RABBITMQ_DEFAULT_PASS: ${SIM_RABBIT_ADMIN_PASSWORD:?Use scripts/simulate_production.py}
      RABBITMQ_DEFAULT_VHOST: hunter_sim
    volumes:
      - simulation_rabbitmq:/var/lib/rabbitmq
      - ${HUNTER_SIM_TLS}/rabbitmq:/run/tls:ro
      - ./ops/rabbitmq.simulation.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports: ['127.0.0.1:55671:5671', '127.0.0.1:55673:15672']
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 24
  api:
    extends: {file: compose.app.yaml, service: api}
    environment:
      SSL_CERT_FILE: /run/tls/ca.crt
    volumes: ['${HUNTER_SIM_TLS}/client:/run/tls:ro']
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  worker:
    extends: {file: compose.app.yaml, service: worker}
    environment:
      SSL_CERT_FILE: /run/tls/ca.crt
    volumes: ['${HUNTER_SIM_TLS}/client:/run/tls:ro']
    depends_on:
      api: {condition: service_healthy}
  scheduler:
    extends: {file: compose.app.yaml, service: scheduler}
    environment:
      SSL_CERT_FILE: /run/tls/ca.crt
      HUNTER_COLLECTION_ENABLED: '0'
    volumes: ['${HUNTER_SIM_TLS}/client:/run/tls:ro']
    depends_on:
      api: {condition: service_healthy}
  frontend:
    extends: {file: compose.app.yaml, service: frontend}
    ports: !override ['127.0.0.1:8443:8443']
    volumes:
      - ${HUNTER_SIM_TLS}/frontend:/run/tls:ro
      - ./ops/nginx.simulation.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  simulation_postgres:
  simulation_rabbitmq:
